name: Sync Discord drops

# Reliably pulls new "drop of the week" images into R2 on a schedule, so drops
# appear without depending on the page's lazy after() trigger (which only fires
# on a visit that happens to land on a revalidation). Just calls the existing
# secret-gated sync route.
#
# Setup (one-time): add repo secret DISCORD_SYNC_SECRET
#   (Settings -> Secrets and variables -> Actions) matching the value set on the
#   worker via `npx wrangler secret put DISCORD_SYNC_SECRET`.

on:
  schedule:
    # Every ~15 min (best-effort; GitHub delays scheduled runs under load).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {} # allow manual runs from the Actions tab

# Don't stack runs if one is slow.
concurrency:
  group: drops-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger incremental sync
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.DISCORD_SYNC_SECRET }}" \
            "https://feprestige.com/api/discord/sync?mode=incremental" \
            -w '\nHTTP %{http_code}\n'
